name: Capture seasons

on:
  workflow_dispatch:   # one-off: re-capture past seasons (the site job captures the current one on every run)

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capture 2025 and 2026 from Sleeper
        working-directory: pipeline
        run: |
          node pull_season.mjs 2025 1261744566235574272
          node pull_season.mjs 2026 1363550282381795328
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/history/raw
          if ! git diff --cached --quiet; then git commit -m "Capture Sleeper seasons [skip ci]"; git pull --rebase --autostash origin main; git push; fi
