name: Build and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/site.yml']
  schedule:
    - cron: '17 10 * * 2'         # Tuesday morning: week complete
    - cron: '*/10 0-5 * * 5'      # Thursday night
    - cron: '*/10 13-23 * * 0'    # Sunday
    - cron: '*/10 0-5 * * 1'      # Sunday night
    - cron: '*/10 0-5 * * 2'      # Monday night
    - cron: '*/10 17-23 * 12 6'   # December Saturdays
    - cron: '*/10 0-5 * 12 0'     # December Saturday nights
    - cron: '*/10 16-23 * 11 4'     # Thanksgiving Thursday daytime games (November Thursdays)
    - cron: '*/10 17-23 * 11,12 5'  # Friday games (Black Friday, Christmas on a Friday)
    - cron: '*/10 0-5 * 11,12 6'    # Friday night games
    - cron: '*/10 17-23 * 12 3'     # Christmas on a Wednesday
    - cron: '*/10 0-5 * 12 4'       # Christmas Wednesday night

permissions:
  contents: write   # the weekly run commits the refreshed Sleeper capture
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: pipeline
        run: |
          pip install numpy pillow
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Past seasons cache
        # a finished season is rebuilt only when the code or its capture changes
        uses: actions/cache@v4
        with:
          path: archive
          key: past-v1-${{ hashFiles('pipeline/*.py', 'pipeline/*.mjs', 'pipeline/*.js', 'pipeline/*.html', 'pipeline/*.css', 'pipeline/*.json', 'pipeline/pos/*.py', 'pipeline/logos/**', 'pipeline/history/raw/**') }}
      - name: Capture the current season from Sleeper
        working-directory: pipeline
        run: |
          CUR=$(python3 -c "import json;c=json.load(open('seasons.json'));print(c['current'],c['leagues'][c['current']])")
          node pull_season.mjs $CUR
      - name: FantasyPros cache
        uses: actions/cache@v4
        with:
          path: pipeline/fp
          key: fp-${{ github.run_id }}
          restore-keys: fp-
      - name: FantasyPros projections (second opinion for the pre-game sim; skipped without FP_API_KEY)
        continue-on-error: true
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
        run: |
          export DT_SEASON=$(python3 -c "import json;print(json.load(open('pipeline/seasons.json'))['current'])") DT_LEAGUE=$(python3 -c "import json;c=json.load(open('pipeline/seasons.json'));print(c['leagues'][c['current']])")
          python3 pipeline/fp_pull.py
      - name: Tab chunk cache
        # on-demand tabs: the previous builds' chunk files stay published, so a page left open across a deploy can
        # still open its tabs (pipeline/lazy.py keeps the last 6 changed builds' chunks)
        uses: actions/cache@v4
        with:
          path: .chunks
          key: chunks-${{ github.run_id }}
          restore-keys: chunks-
      - name: Build the current season
        env:
          DT_CHUNKS: ${{ github.workspace }}/.chunks
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('pipeline/seasons.json'))['current'])")
          python3 pipeline/season_replay.py $CUR
          mkdir -p site && cp .season/$CUR/site/index.html site/index.html && touch site/.nojekyll
          cp -r .season/$CUR/site/p site/p  # the tabs' chunk files (on-demand tabs)
      - name: Build past seasons
        run: |
          for Y in $(python3 -c "import json;c=json.load(open('pipeline/seasons.json'));print(' '.join(y for y in c['leagues'] if y!=c['current']))"); do
            if [ ! -f archive/$Y/index.html ]; then
              python3 pipeline/season_replay.py $Y && mkdir -p archive/$Y && cp .season/$Y/site/index.html archive/$Y/index.html
            fi
            mkdir -p site/$Y && cp archive/$Y/index.html site/$Y/index.html
          done
      - name: Save the current season's capture to the repo
        # Tuesday weekly run, pushes and manual runs only (not the 10-minute game-window runs), so the repo always holds
        # the latest completed week for local builds and checks. [skip ci] keeps it from triggering another build.
        if: github.event_name != 'schedule' || github.event.schedule == '17 10 * * 2'
        continue-on-error: true
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('pipeline/seasons.json'))['current'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/history/raw/$CUR
          if git diff --cached --quiet; then echo "capture unchanged"; exit 0; fi
          git commit -m "Save season capture $CUR [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
