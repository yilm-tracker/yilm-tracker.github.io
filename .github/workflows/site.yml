name: Build and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/site.yml']
  schedule:
    - cron: '17 10 * * 2'         # Tuesday morning: week complete
    - cron: '*/10 0-5 * * 5'      # Thursday night
    - cron: '*/10 13-23 * * 0'    # Sunday
    - cron: '*/10 0-5 * * 1'      # Sunday night
    - cron: '*/10 0-5 * * 2'      # Monday night
    - cron: '*/10 17-23 * 12 6'   # December Saturdays
    - cron: '*/10 0-5 * 12 0'     # December Saturday nights

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: pipeline
        run: |
          pip install numpy pillow
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Past seasons cache
        # a finished season is rebuilt only when the code or its capture changes
        uses: actions/cache@v4
        with:
          path: archive
          key: past-v1-${{ hashFiles('pipeline/*.py', 'pipeline/*.mjs', 'pipeline/*.js', 'pipeline/*.html', 'pipeline/*.css', 'pipeline/*.json', 'pipeline/pos/*.py', 'pipeline/logos/**', 'pipeline/history/raw/**') }}
      - name: Capture the current season from Sleeper
        working-directory: pipeline
        run: |
          CUR=$(python3 -c "import json;c=json.load(open('seasons.json'));print(c['current'],c['leagues'][c['current']])")
          node pull_season.mjs $CUR
      - name: Build the current season
        run: |
          CUR=$(python3 -c "import json;print(json.load(open('pipeline/seasons.json'))['current'])")
          python3 pipeline/season_replay.py $CUR
          mkdir -p site && cp .season/$CUR/site/index.html site/index.html && touch site/.nojekyll
      - name: Build past seasons
        run: |
          for Y in $(python3 -c "import json;c=json.load(open('pipeline/seasons.json'));print(' '.join(y for y in c['leagues'] if y!=c['current']))"); do
            if [ ! -f archive/$Y/index.html ]; then
              python3 pipeline/season_replay.py $Y && mkdir -p archive/$Y && cp .season/$Y/site/index.html archive/$Y/index.html
            fi
            mkdir -p site/$Y && cp archive/$Y/index.html site/$Y/index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
